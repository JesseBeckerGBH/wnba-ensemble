# Railway config for the FRONTEND dashboard service.
# In the Railway dashboard, create a service with Root Directory = killershades-web
# so nixpacks detects the Node app (package.json) here. See ../DEPLOY_RAILWAY.md.

[build]
builder = "nixpacks"
# nixpacks auto-runs `npm install` + `npm run build` (the "build" script).
watchPatterns = ["**"]

[deploy]
# Serve the production build (dist/) and bind Railway's injected $PORT.
startCommand = "npm run preview -- --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
