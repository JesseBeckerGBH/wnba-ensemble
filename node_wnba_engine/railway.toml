# Railway config for the WNBA INFERENCE API service.
# In the Railway dashboard, create a service with Root Directory = node_wnba_engine
# so this file is picked up. See ../DEPLOY_RAILWAY.md for the full walkthrough.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.api"
watchPatterns = ["**"]

[deploy]
# uvicorn binds $PORT inside the Dockerfile CMD.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
